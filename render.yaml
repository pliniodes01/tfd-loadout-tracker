services:
  - type: web
    runtime: static
    name: tfd-loadout-tracker
    repo: https://github.com/pliniodes01/tfd-loadout-tracker
    branch: main
    buildCommand: ./render-build
    staticPublishPath: ./dist
    autoDeployTrigger: commit
    headers:
      - path: /*
        name: X-Content-Type-Options
        value: nosniff
      - path: /*
        name: X-Frame-Options
        value: DENY
      - path: /*
        name: Referrer-Policy
        value: strict-origin-when-cross-origin
      - path: /assets/*
        name: Cache-Control
        value: public, max-age=31536000, immutable
